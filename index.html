<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ewan McCorkell</title>
<meta name="description" content="Computer science projects by Ewan McCorkell.">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Space+Mono:wght@700&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #ff6a00;
    --ink: #0b0b0b;
    --dim: rgba(11, 11, 11, .22);
    --white: #fffaf2;
    --pink: #ff2e93;
    --cyan: #00d8ff;
    --gutter: clamp(16px, 2.6vw, 44px);
    --ease-out: cubic-bezier(.16, 1, .3, 1);
    --ease-back: cubic-bezier(.34, 1.6, .64, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; background: var(--orange); color: var(--ink);
    font-family: "Archivo", "Arial Black", sans-serif; font-weight: 800;
    overflow: hidden; overscroll-behavior: none; -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--ink); color: var(--orange); }

  #logo { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; pointer-events: none; z-index: 0; }
  .page { position: relative; z-index: 1; height: 100vh; height: 100dvh; }

  /* ---------- name ---------- */
  .side { position: relative; z-index: 1; padding: var(--gutter); width: 50%; }
  .name { font-size: clamp(40px, 6.2vw, 124px); font-weight: 900; font-stretch: 112%; letter-spacing: -.04em; line-height: .86; }
  .gh { display: inline-block; margin-top: 1.4em; font-size: clamp(12px, .95vw, 15px); font-weight: 700; letter-spacing: .03em; text-transform: uppercase; border-bottom: 2px solid var(--ink); padding-bottom: 2px; }
  .gh:hover { background: var(--ink); color: var(--orange); }

  /* ---------- list: a 3D drum on the right ---------- */
  .viewport {
    position: absolute; inset: 0; z-index: 2;
    pointer-events: none; touch-action: none; overflow: hidden;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 16%, #000 84%, transparent 100%);
            mask-image: linear-gradient(to bottom, transparent 0, #000 16%, #000 84%, transparent 100%);
  }
  .list { list-style: none; position: absolute; left: 38%; right: 0; top: 0; padding: 0 7vw 0 0; will-change: transform; text-align: right; }
  .row {
    position: relative; display: block; padding: 24px 0 30px;
    color: var(--ink); outline: none; pointer-events: auto;
    transform-origin: 100% 50%; transition: color .3s var(--ease-out);
  }
  .row.on { z-index: 5; }
  .list.has-on .row:not(.on) { color: var(--dim); }

  .body { position: relative; z-index: 2; display: block; }
  .tw { position: relative; display: inline-block; }
  .title {
    position: relative; z-index: 2; display: inline-block;
    font-size: clamp(36px, 4.6vw, 98px); font-weight: 900; font-stretch: 108%;
    letter-spacing: -.035em; line-height: .92; white-space: nowrap;
    transform-origin: 100% 60%;
    transition: transform .45s var(--ease-back), color .12s, text-shadow .12s;
  }
  .row.on .title { color: var(--t, var(--ink)); text-shadow: .05em .05em 0 var(--ts, var(--white)); transform: rotate(var(--tilt, 0deg)) scale(1.06); }

  .meta {
    position: absolute; z-index: 4; right: 0; top: calc(100% + 4px); max-width: min(92%, 460px);
    padding: 6px 9px; background: var(--ink); color: var(--white);
    font-size: clamp(12px, .9vw, 15px); font-weight: 600; font-stretch: 100%; line-height: 1.3;
    opacity: 0; transform: translateY(-8px); transform-origin: 100% 0;
    transition: opacity .12s, transform .4s var(--ease-back); pointer-events: none;
  }
  .meta .lang { font-weight: 800; text-transform: uppercase; letter-spacing: .02em; margin-left: .9em; color: var(--orange); }
  .row.on .meta { opacity: 1; transform: rotate(var(--tilt, 0deg)); transition-delay: .1s; }

  /* ---------- the streak: whips in from the screen's right edge, wraps the title, ends in sharp tongues ---------- */
  .win {
    position: absolute; z-index: 1; pointer-events: none;
    right: var(--r, 0); top: 50%; width: var(--w, 0); height: var(--h, 0);
    translate: 0 -50%; transform-origin: calc(100% - var(--ox, 0px)) 50%; rotate: var(--tilt, 0deg);
    opacity: 0; visibility: hidden; transition: opacity .12s, visibility 0s .12s;
  }
  .row.on .win { opacity: 1; visibility: visible; transition: opacity .03s; }
  .win canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .win .tag { position: absolute; z-index: 2; left: 2%; top: 4%; padding: 6px 9px; background: var(--ink); color: var(--white); font: 700 11px/1.2 "Space Mono", monospace; letter-spacing: .08em; text-transform: uppercase; rotate: -4deg; white-space: nowrap; box-shadow: 4px 4px 0 var(--white); }

  .row[data-motif="bytes"] .title .txt { position: relative; }
  .row[data-motif="bytes"].on .title .txt::before,
  .row[data-motif="bytes"].on .title .txt::after { content: attr(data-text); position: absolute; left: 0; top: 0; text-shadow: none; }
  .row[data-motif="bytes"].on .title .txt::before { color: var(--cyan); animation: g-a 1.1s steps(1) infinite; }
  .row[data-motif="bytes"].on .title .txt::after { color: var(--pink); animation: g-b .9s steps(1) infinite; }
  @keyframes g-a { 0% { clip-path: inset(10% 0 70% 0); transform: translateX(-8px); } 20% { clip-path: inset(55% 0 25% 0); transform: translateX(10px); } 40% { clip-path: inset(80% 0 4% 0); transform: translateX(-4px); } 60% { clip-path: inset(30% 0 52% 0); transform: translateX(6px); } 80% { clip-path: inset(0 0 100% 0); } }
  @keyframes g-b { 0% { clip-path: inset(62% 0 18% 0); transform: translateX(9px); } 25% { clip-path: inset(0 0 100% 0); } 50% { clip-path: inset(20% 0 66% 0); transform: translateX(-11px); } 75% { clip-path: inset(42% 0 40% 0); transform: translateX(4px); } }

  @media (max-width: 820px) {
    .side { width: auto; padding-right: 34vw; }
    .name { font-size: clamp(34px, 9.4vw, 64px); }
    .gh { margin-top: 1em; }
    .viewport { top: 150px; }
    .list { left: 0; padding: 0 var(--gutter); }
    .title { font-size: clamp(34px, 10vw, 60px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .row .title, .row .title * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<canvas id="logo" role="img" aria-label="Ewan McCorkell logo"></canvas>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="vblur" x="-5%" y="-10%" width="110%" height="120%" color-interpolation-filters="sRGB">
    <feGaussianBlur id="vblur-amt" stdDeviation="0 0"/>
  </filter>
</svg>

<main class="page">
  <header class="side">
    <h1 class="name">Ewan<br>McCorkell</h1>
    <a class="gh" href="https://github.com/voxelocity" target="_blank" rel="noopener">GitHub ↗</a>
  </header>
  <nav class="viewport" id="viewport" aria-label="Projects">
    <ol class="list" id="list"></ol>
  </nav>
</main>

<script>
(() => {
  const GH = "https://github.com/voxelocity/";
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const DPR = Math.min(2, devicePixelRatio || 1);
  const TAU = Math.PI * 2, INK = "#0b0b0b";

  // t = title colour while its streak is open, ts = its hard shadow
  const projects = [
    { name: "Wyrd",           motif: "wyrd",    lang: "Swift",      desc: "iOS routines app for ADHD brains, with Sparky.", repo: "Wyrd", t: "#f3f5f4", ts: INK },
    { name: "Shaderlab",      motif: "shader",  lang: "JavaScript", desc: "Stackable GPU effects: dither, ASCII, halftone, CRT.", href: "https://voxelocity.github.io/Shaderlab/", t: INK, ts: "#f4f0e4" },
    { name: "Vertigo",        motif: "vertigo", lang: "TypeScript", desc: "Two-button rhythm game for the browser. Hand-drawn sprites.", href: "https://voxelocity.github.io/Vertigo/", t: "#e8e8f0", ts: INK },
    { name: "Lintel",         motif: "lintel",  lang: "C#",         desc: "A macOS-style top toolbar for Windows.", repo: "Lintel", t: "#f2f2f7", ts: INK },
    { name: "Zen Host",       motif: "zen",     lang: "Electron",   desc: "Free local Minecraft server host with mod support.", href: "https://voxelocity.github.io/Zen-Host/", t: INK, ts: "#fff" },
    { name: "FERN-2.5",       motif: "fern",    lang: "Python",     desc: "Block-diffusion MoE language model that trains on one consumer GPU.", repo: "FERN-2.5", t: INK, ts: "#efe6cf" },
    { name: "burnit",         motif: "burnit",  lang: "C#",         desc: "Burns CD, DVD and Blu-ray from the terminal, with a live view of the laser.", repo: "burnit-CLI", t: "#fff", ts: INK },
    { name: "Byte Launderer", motif: "bytes",   lang: "HTML",       desc: "Converts anything to anything by rewriting the header on raw bytes.", href: "https://voxelocity.github.io/Byte_Launderer/", t: "#fff", ts: INK },
  ];

  /* =====================================================================
     shared toolkit
     ===================================================================== */
  const rng = (seed) => { let a = seed >>> 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const hash = (a, b) => { const r = rng((a * 73856093) ^ (b * 19349663)); return r(); };
  const easeBack = (p) => 1 + 2.70158 * Math.pow(p - 1, 3) + 1.70158 * Math.pow(p - 1, 2);   // Ease.back, from Wyrd's Choreography.swift
  const grow = (t, d = .3) => t <= 0 ? 0 : t >= d ? 1 : easeBack(t / d);

  /* The streak. Band from the right edge (behind the title), flaring as it goes left, then splitting into
     sharp tongues. The band whips out first, the tongues shoot out after, and the tips crackle each beat. */
  function streak(s, t, o) {
    const b = rng(o.seed), j = rng(o.seed * 7 + Math.floor(t * (o.boil || 7)) * 131 + 1);
    const W = s.W, cy = s.cy, hb = o.band / 2, rise = o.rise || 0;
    const gw = Math.min(1, grow(t, .18)), g = grow(t - .05, .3);
    const base0 = s.tx - (o.gap ?? 26), base = W - (W - base0) * gw;
    const reach = Math.min(o.len, base0 - 8);
    const pts = [{ x: W + 40, y: cy - hb }];
    pts.push({ x: base, y: cy - hb - rise, curve: [base + (W - base) * .5, cy - hb] });
    const tips = [];
    for (let i = 0; i < o.n; i++) {
      const f = o.n === 1 ? .5 : i / (o.n - 1);
      const L = reach * (.62 + .38 * b()) * (1 + (j() - .5) * .1) * g;
      const ty = cy + (f - .5) * 2 * (hb + rise + (o.spread || 0)) + (b() - .5) * 16 + (j() - .5) * 5;
      const tip = { x: base - L, y: ty, tip: true }; pts.push(tip); tips.push(tip);
      if (i < o.n - 1) { const f2 = (i + .5) / (o.n - 1); pts.push({ x: base - L * (.1 + .22 * b()), y: cy + (f2 - .5) * 2 * (hb + rise) * .85 }); }
    }
    pts.push({ x: base, y: cy + hb + rise });
    pts.push({ x: W + 40, y: cy + hb, curve: [base + (W - base) * .5, cy + hb] });
    return { pts, tips, base, g, gw };
  }
  function streakPath(x, pts, style = "sharp", G = 12) {
    if (style === "step") {
      const sn = (v) => Math.round(v / G) * G;
      x.beginPath(); let cx = sn(pts[0].x), cy = sn(pts[0].y); x.moveTo(cx, cy);
      for (let i = 1; i <= pts.length; i++) {
        const p = pts[i % pts.length], tx = sn(p.x), ty = sn(p.y);
        while (cx !== tx || cy !== ty) {
          if (cx !== tx) { cx += Math.sign(tx - cx) * G; x.lineTo(cx, cy); }
          if (cy !== ty) { cy += Math.sign(ty - cy) * G; x.lineTo(cx, cy); }
        }
      }
      x.closePath(); return;
    }
    x.beginPath(); x.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) {
      const p = pts[i];
      if (p.curve) x.quadraticCurveTo(p.curve[0], p.curve[1], p.x, p.y);
      else x.lineTo(p.x, p.y);
    }
    x.closePath();
  }
  function paint(x, pts, fill, style, G) {
    x.save(); x.translate(9, 10); streakPath(x, pts, style, G); x.fillStyle = INK; x.fill(); x.restore();
    streakPath(x, pts, style, G); x.fillStyle = fill; x.fill();
  }
  const loadImg = (src) => { const i = new Image(); i.src = src; return i; };
  const DEFS = {};

  /* =====================================================================
     WYRD: the habit heat-grid in Wyrd's own calendar colours fills as a completion wave sweeps through;
     when the wave reaches a tongue tip it fires the app's ConfettiBurst (Effects.swift). Flat Sparky
     (SparkyGlyph.swift) does the real `.jump` from Choreography.swift, with smear ghosts.
     ===================================================================== */
  const HEAT = ["#1B201D", "#164128", "#1D6E3E", "#29A857", "#3BE37A"];   // Theme.heat (dark) + green
  const CONFETTI = ["#3BE37A", "#A8F5C5", "#FFFFFF", "#1D6E3E"];
  const EASE = { linear: p => p, easeIn: p => p * p * p, easeOut: p => 1 - Math.pow(1 - p, 3), easeInOut: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2, back: easeBack };
  const K = (t, v, e = "easeInOut") => ({ t, v, e });
  const sample = (keys, t, fb) => {
    if (!keys.length) return fb; if (t <= keys[0].t) return keys[0].v;
    for (let i = 0; i < keys.length - 1; i++) { const a = keys[i], b = keys[i + 1]; if (t < b.t) { const p = (t - a.t) / Math.max(b.t - a.t, 1e-4); return a.v + (b.v - a.v) * EASE[b.e](p); } }
    return keys[keys.length - 1].v;
  };
  const JUMP = {
    y:  [K(0, 0), K(.12, 6, "easeOut"), K(.32, -88, "easeOut"), K(.4, -94), K(.57, 0, "easeIn"), K(.64, 5, "easeOut"), K(.8, 0, "easeOut")],
    sx: [K(0, 1), K(.12, 1.24, "easeOut"), K(.2, .86, "easeOut"), K(.38, 1), K(.55, .94, "easeIn"), K(.62, 1.28, "easeOut"), K(.8, 1, "back")],
    sy: [K(0, 1), K(.12, .72, "easeOut"), K(.2, 1.22, "easeOut"), K(.38, 1), K(.55, 1.1, "easeIn"), K(.62, .7, "easeOut"), K(.8, 1, "back")],
    r:  [K(0, 0), K(.2, -8), K(.45, 6), K(.62, 0)],
  };
  const pose = (t) => ({ y: sample(JUMP.y, t, 0), sx: sample(JUMP.sx, t, 1), sy: sample(JUMP.sy, t, 1), r: sample(JUMP.r, t, 0) });
  const LOBES = [[.32, .34, .19], [.68, .34, .19], [.19, .55, .17], [.81, .55, .17], [.35, .69, .18], [.65, .69, .18], [.5, .56, .27]];
  function glyph(x, px, py, S, p, alpha, happy) {
    x.save(); x.globalAlpha = alpha; x.translate(px, py); x.rotate(p.r * Math.PI / 180); x.scale(p.sx, p.sy);
    x.fillStyle = INK; for (const l of LOBES) { x.beginPath(); x.arc((l[0] - .5) * S + 4, (l[1] - .87) * S + 5, l[2] * S, 0, TAU); x.fill(); }
    x.fillStyle = "#3BE37A"; for (const l of LOBES) { x.beginPath(); x.arc((l[0] - .5) * S, (l[1] - .87) * S, l[2] * S, 0, TAU); x.fill(); }
    x.fillStyle = "#fff"; x.strokeStyle = "#fff";
    for (const sd of [-1, 1]) {
      const ex = sd * .088 * S, ey = (.52 - .87) * S;
      if (happy) { x.lineWidth = .05 * S; x.lineCap = "round"; x.beginPath(); x.moveTo(ex - .05 * S, ey + .025 * S); x.quadraticCurveTo(ex, ey - .075 * S, ex + .05 * S, ey + .025 * S); x.stroke(); }
      else { x.beginPath(); x.roundRect(ex - .0425 * S, ey - .095 * S, .085 * S, .19 * S, .0425 * S); x.fill(); }
    }
    x.restore();
  }
  function spawnConfetti(list, ox, oy, t) {
    for (let i = 0; i < 60; i++) {
      const a = -Math.PI * .95 + Math.random() * Math.PI * .9, sp = (450 + Math.random() * 650) * .38, w = 7 + Math.random() * 4;
      list.push({ born: t, ox, oy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, spin: -12 + Math.random() * 24, wob: 3 + Math.random() * 5, w, h: w * (.45 + Math.random() * .55), c: CONFETTI[(Math.random() * 4) | 0], circle: Math.random() < .25 });
    }
  }
  function drawConfetti(x, list, t) {
    for (let i = list.length - 1; i >= 0; i--) {
      const f = list[i], ct = t - f.born; if (ct > 2.2) { list.splice(i, 1); continue; }
      const drag = 1 - Math.exp(-ct * 2.2);
      x.save(); x.globalAlpha = ct > 1.7 ? (2.2 - ct) / .5 : 1;
      x.translate(f.ox + f.vx / 2.2 * drag + Math.sin(ct * f.wob) * 12, f.oy + f.vy / 2.2 * drag + 230 * ct * ct);
      x.rotate(ct * f.spin); x.scale(1, Math.abs(Math.cos(ct * f.spin * .7)) * .8 + .2);
      x.fillStyle = f.c; x.beginPath();
      if (f.circle) x.ellipse(0, 0, f.w / 2, f.h / 2, 0, 0, TAU); else x.roundRect(-f.w / 2, -f.h / 2, f.w, f.h, 2);
      x.fill(); x.restore();
    }
  }
  // Sparky in any urgency colour, with the four eye styles from SparkyGlyph.swift
  function sparky(x, px, py, S, p, alpha, col, eyes) {
    x.save(); x.globalAlpha = alpha; x.translate(px, py); x.rotate(p.r * Math.PI / 180); x.scale(p.sx, p.sy);
    x.fillStyle = INK; for (const l of LOBES) { x.beginPath(); x.arc((l[0] - .5) * S + S * .04, (l[1] - .87) * S + S * .05, l[2] * S, 0, TAU); x.fill(); }
    x.fillStyle = col; for (const l of LOBES) { x.beginPath(); x.arc((l[0] - .5) * S, (l[1] - .87) * S, l[2] * S, 0, TAU); x.fill(); }
    x.fillStyle = "#fff"; x.strokeStyle = "#fff";
    for (const sd of [-1, 1]) {
      const ex = sd * .088 * S, ey = (.52 - .87) * S;
      if (eyes === "happy") { x.lineWidth = .05 * S; x.lineCap = "round"; x.beginPath(); x.moveTo(ex - .05 * S, ey + .025 * S); x.quadraticCurveTo(ex, ey - .075 * S, ex + .05 * S, ey + .025 * S); x.stroke(); }
      else if (eyes === "alarmed") { x.beginPath(); x.arc(ex, ey, .06 * S, 0, TAU); x.fill(); }
      else { const h = (eyes === "worried" ? .14 : .19) * S; x.save(); x.translate(ex, ey); if (eyes === "worried") x.rotate(-sd * .24); x.beginPath(); x.roundRect(-.0425 * S, -h / 2, .085 * S, h, .0425 * S); x.fill(); x.restore(); }
    }
    x.restore();
  }
  // NudgeCopy.line in NotificationScheduler.swift, for a routine called "Shower"
  const NUDGES = [
    { title: "Shower", body: "It's time. Tap Done when it's done.", col: "#F3F5F4", eyes: "open" },
    { title: "Psst… Shower", body: "Sparky's still holding onto this one for you.", col: "#FFC94D", eyes: "open" },
    { title: "Still waiting: Shower", body: "Tiny step: just start it for two minutes.", col: "#FF9A4D", eyes: "alarmed" },
    { title: "Not letting this go", body: "Shower is still on your list. Done, or snooze?", col: "#FF6B5E", eyes: "worried", shake: true },
  ];
  DEFS.wyrd = {
    tail: 560, h: 500,
    start(s) { s.st = { flakes: [], cyc: -1 }; },
    draw(s, t) {
      // Wyrd's nudges, as stylised iOS notifications: each one slides out from behind the word and stacks,
      // escalating through the urgency colours (Theme.swift) with Sparky reacting in the app icon. The last one
      // rattles, Done gets pressed, the card goes green and Sparky jumps out with the app's ConfettiBurst.
      const x = s.ctx, st = s.st, cy = s.cy, CW = 380, CH = 96, R = 24;
      const C = 6.2, cyc = Math.floor(t / C), tl = t % C, DONE = 4.6, EXIT = 5.75;
      if (st.cyc !== cyc) { st.cyc = cyc; st.fired = false; }
      // shrink the whole group around the word's left edge when there isn't room for a full-size card
      const fit = clamp((s.tx - 16) / (CW + 34), .5, 1);
      x.save(); x.translate(s.tx, cy); x.scale(fit, fit); x.translate(-s.tx, -cy);
      const targetX = s.tx - CW - 34, startX = s.tr - CW * .5;
      const arrivals = NUDGES.map((_, i) => .05 + i * 1.1);
      const shown = arrivals.filter(a => tl >= a).length;
      const exit = tl > EXIT ? clamp((tl - EXIT) / .35, 0, 1) : 0;
      // draw back cards first
      for (let i = 0; i < shown; i++) {
        const n = NUDGES[i], depth = shown - 1 - i, a = clamp((tl - arrivals[i]) / .5, 0, 1), e = easeBack(Math.max(a, .0001));
        const back = Math.min(depth, 3);
        let cx = startX + (targetX - startX) * e + back * 14 + exit * (s.tr - targetX);
        let ccy = cy - CH / 2 + back * 18;
        const sc = 1 - back * .06, rot = (-.05 + i * .025) * (1 - exit) + (1 - e) * -.18;
        if (n.shake && depth === 0 && tl < DONE) cx += Math.sin(tl * 70) * 5 * clamp(1 - (tl - arrivals[i] - .5) / .9, 0, 1);
        const done = depth === 0 && tl >= DONE;
        const col = done ? "#3BE37A" : n.col;
        x.save(); x.translate(cx + CW / 2, ccy + CH / 2); x.rotate(rot); x.scale(sc * (1 + (1 - Math.min(1, e)) * .25), sc); x.translate(-CW / 2, -CH / 2);
        x.globalAlpha = (1 - back * .22) * (1 - exit);
        // speed lines while it's still sliding out

        if (cur) { const pat = x.createPattern(cur.img, "repeat"); pat.setTransform(new DOMMatrix().translate(-((i * 137 + (j() < .3 ? boil * 40 : 0)) % 400), y).scale(3)); x.fillStyle = pat; }
        else x.fillStyle = `hsl(${(i * 47 + boil * 20) % 360} 80% 50%)`;
        x.fill();
      }
      x.imageSmoothingEnabled = true;
    },
  };

  /* =====================================================================
     list + streak lifecycle
     ===================================================================== */
  const list = document.getElementById("list");
  // hover tilt is fixed per item and fans from the middle of the list: top half tilts up, bottom half down,
  // a true middle item (odd count) stays level. It never changes with scroll position.
  const mid = (projects.length - 1) / 2;
  list.innerHTML = projects.map((p, i) => {
    const tag = p.motif === "shader" || p.motif === "bytes" ? `<b class="tag"></b>` : "";
    return `<li><a class="row" href="${p.href || GH + p.repo}" target="_blank" rel="noopener" data-motif="${p.motif}" style="--t:${p.t};--ts:${p.ts};--tilt:${reduced ? 0 : ((mid - i) * 1.6).toFixed(2)}deg">
      <span class="body">
        <span class="tw"><span class="title"><span class="txt" data-text="${p.name}">${p.name}</span></span><span class="win" aria-hidden="true"><canvas></canvas>${tag}</span></span>
        <span class="meta"><span class="desc">${p.desc}</span><span class="lang">${p.lang}</span></span>
      </span>
    </a></li>`;
  }).join("");
  const rows = [...list.querySelectorAll(".row")];
  const viewport = document.getElementById("viewport");

  // The title's own letterforms, drawn into canvas space, so effects can start inside the word and flow out of it.
  function sampleGlyphs(s, title) {
    const fs = parseFloat(getComputedStyle(title).fontSize);
    const c = document.createElement("canvas"); c.width = Math.ceil(s.W); c.height = Math.ceil(s.H);
    const x = c.getContext("2d", { willReadFrequently: true });
    x.font = `900 ${fs}px Archivo, "Arial Black", sans-serif`;
    try { x.fontStretch = "semi-expanded"; x.letterSpacing = (-.035 * fs) + "px"; } catch (e) { /* older canvas: close enough */ }
    x.textAlign = "right"; x.textBaseline = "middle"; x.fillStyle = "#000";
    x.fillText(title.textContent, s.tr, s.cy + fs * .04);
    const d = x.getImageData(0, 0, c.width, c.height).data, pts = [];
    const x0 = Math.max(0, Math.floor(s.tx - 30)), x1 = Math.min(c.width, Math.ceil(s.tr + 10));
    for (let y = 0; y < c.height; y += 3) for (let xx = x0; xx < x1; xx += 3) if (d[(y * c.width + xx) * 4 + 3] > 140) pts.push([xx, y]);
    return pts.length ? pts : [[(s.tx + s.tr) / 2, s.cy]];
  }

  let splat = null;
  function startSplat(row) {
    const win = row.querySelector(".win"), d = DEFS[row.dataset.motif], title = row.querySelector(".title");
    // size the canvas so it runs from the screen's right edge, behind the title, out to the tongue tips
    const pad = parseFloat(getComputedStyle(list).paddingRight) || 0, tw = title.offsetWidth;
    const avail = viewport.clientWidth - pad - tw;
    const tail = Math.round(clamp(avail - 10, 200, d.tail)), extra = pad + 30;
    const W = tail + tw + extra, H = d.h;
    win.style.setProperty("--w", W + "px"); win.style.setProperty("--h", H + "px"); win.style.setProperty("--r", -extra + "px"); win.style.setProperty("--ox", extra + "px");
    let s = win._s;
    if (!s) s = win._s = { win, c: win.querySelector("canvas"), d, st: {} };
    const resized = s.W !== W || s.H !== H;
    if (resized) { s.c.width = Math.round(W * DPR); s.c.height = Math.round(H * DPR); s.W = W; s.H = H; }
    const moved = s.tx !== tail || s.tr !== tail + tw;
    s.tx = tail; s.tr = tail + tw; s.cy = H / 2; s.th = title.offsetHeight;
    if (resized || moved || !s.glyphs) s.glyphs = sampleGlyphs(s, title);
    if (!s.inited) { s.inited = true; if (!d.gl) s.ctx = s.c.getContext("2d"); d.init?.(s); d.resize?.(s); }
    else if (resized) d.resize?.(s);
    s.t0 = performance.now(); s.last = s.t0; d.start?.(s);
    return s;
  }
  function frameSplat(s, now) {
    let t = Math.max(0, (now - s.t0) / 1000); const dt = clamp((now - s.last) / 1000, 0, .05); s.last = Math.max(s.last, now);
    if (reduced) t += 1;
    if (s.ctx) {
      const x = s.ctx; x.setTransform(DPR, 0, 0, DPR, 0, 0); x.clearRect(0, 0, s.W, s.H);
      if (t < .25) x.translate((Math.random() - .5) * 12 * (1 - t / .25), (Math.random() - .5) * 12 * (1 - t / .25));   // impact shake
    }
    s.d.draw(s, t, dt);
  }

  let active = null;
  const setActive = (row) => {
    if (row === active) return;
    if (active) active.classList.remove("on");
    active = row; splat = null;
    list.classList.toggle("has-on", !!row);
    if (row) { row.classList.add("on"); splat = startSplat(row); }
  };

  /* ---------- tactile scroll on a 3D drum: smoothed, rubber-banded, snapping, motion-blurred ---------- */
  const blurNode = document.getElementById("vblur-amt");
  let target = 0, current = 0, prev = 0, vel = 0, max = 0, snaps = [0], vh = 0;
  const OVER = 140;
  const tilt = rows.map(() => 1);

  const measure = () => {
    vh = viewport.clientHeight;
    const rh = rows[0].offsetHeight;
    list.style.paddingTop = list.style.paddingBottom = Math.max(0, vh / 2 - rh / 2) + "px";
    max = Math.max(0, list.offsetHeight - vh);
    const top0 = rows[0].parentElement.offsetTop;
    snaps = rows.map(r => Math.min(max, r.parentElement.offsetTop - top0));
    target = clamp(target, 0, max); current = clamp(current, 0, max);
  };
  const nearestSnap = (v) => { v = clamp(v, 0, max); let best = snaps[0]; for (const s of snaps) if (Math.abs(s - v) < Math.abs(best - v)) best = s; return best; };
  const rubber = (raw) => raw < 0 ? raw * .35 : raw > max ? max + (raw - max) * .35 : raw;

  let idle;
  const settleSoon = (ms = 150) => { clearTimeout(idle); idle = setTimeout(() => { target = nearestSnap(target); }, ms); };

  addEventListener("wheel", (e) => {
    e.preventDefault();
    let d = e.deltaY * (e.deltaMode === 1 ? 36 : e.deltaMode === 2 ? innerHeight : 1);
    if (target < 0 || target > max) d *= .3;
    target = clamp(target + d, -OVER, max + OVER);
    settleSoon();
  }, { passive: false });

  addEventListener("keydown", (e) => {
    const i = snaps.indexOf(nearestSnap(target));
    if (["ArrowDown", "PageDown", "j"].includes(e.key)) { target = snaps[Math.min(snaps.length - 1, i + 1)]; e.preventDefault(); }
    else if (["ArrowUp", "PageUp", "k"].includes(e.key)) { target = snaps[Math.max(0, i - 1)]; e.preventDefault(); }
    else if (e.key === "Home") target = 0;
    else if (e.key === "End") target = max;
  });

  let drag = null;
  addEventListener("touchstart", (e) => {
    const t = e.touches[0];
    drag = { y: t.clientY, start: target, moved: false, samples: [[performance.now(), t.clientY]] };
    clearTimeout(idle);
  }, { passive: true });
  addEventListener("touchmove", (e) => {
    if (!drag) return;
    const t = e.touches[0], dy = drag.y - t.clientY;
    if (Math.abs(dy) > 6) drag.moved = true;
    if (drag.moved) e.preventDefault();
    target = rubber(drag.start + dy);
    drag.samples.push([performance.now(), t.clientY]);
    if (drag.samples.length > 6) drag.samples.shift();
  }, { passive: false });
  addEventListener("touchend", () => {
    if (!drag) return;
    const s = drag.samples, a = s[0], b = s[s.length - 1];
    const v = b[0] - a[0] > 0 ? (a[1] - b[1]) / (b[0] - a[0]) : 0;
    target = nearestSnap(target + v * 320);
    if (drag.moved) { const block = (ev) => { ev.preventDefault(); ev.stopPropagation(); }; addEventListener("click", block, { capture: true, once: true }); setTimeout(() => removeEventListener("click", block, true), 60); }
    drag = null;
  });

  let px = -1, py = -1, pointerIn = false;
  addEventListener("pointermove", (e) => { if (e.pointerType === "mouse") { px = e.clientX; py = e.clientY; pointerIn = true; pick(); } });
  document.documentElement.addEventListener("pointerleave", () => { pointerIn = false; setActive(null); });
  const pick = () => {
    if (!pointerIn) return;
    let hit = null;
    for (const r of rows) {
      const b = r.getBoundingClientRect();
      if (py >= b.top && py < b.bottom && px >= b.left - 40 && px <= b.right) { hit = r; break; }
    }
    setActive(hit);
  };
  list.addEventListener("focusin", (e) => { const r = e.target.closest(".row"); if (r) { setActive(r); target = snaps[rows.indexOf(r)]; } });
  list.addEventListener("focusout", () => { if (!pointerIn) setActive(null); });

  /* ---------- logo: big in the corner, turned by the scroll like a dial ---------- */
  const cvs = document.getElementById("logo"), ctx = cvs.getContext("2d");
  const img = new Image(); img.src = "logo.png";
  let sprite = null, angle = -8, spin = 0, dirty = true, lx = 0, ly = 0;

  const layoutLogo = () => {
    const W = innerWidth, H = cvs.getBoundingClientRect().height || innerHeight;
    cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR);
    let s, x, y;
    if (W > 820) { const col = W * .5; s = Math.min(col * 1.3, H * .8); x = col * .32; y = H - s * .44; }
    else { s = Math.min(W * .56, 300); x = W - s * .14; y = s * .2; }
    lx = x * DPR; ly = y * DPR;
    if (img.complete && img.naturalWidth) {
      sprite = document.createElement("canvas");
      sprite.width = sprite.height = Math.round(s * DPR);
      const c = sprite.getContext("2d"); c.imageSmoothingQuality = "high";
      c.drawImage(img, 0, 0, sprite.width, sprite.height);
    }
    dirty = true;
  };
  img.onload = layoutLogo;

  const drawLogo = () => {
    if (!sprite) return;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, cvs.width, cvs.height);
    const half = sprite.width / 2;
    const sweep = reduced ? 0 : spin * 2.2;
    const n = Math.max(1, Math.min(22, Math.ceil(Math.abs(sweep) * 2.6)));
    ctx.globalCompositeOperation = n > 1 ? "lighter" : "source-over";
    ctx.globalAlpha = 1 / n;
    for (let i = 0; i < n; i++) {
      const a = (angle - sweep * (n === 1 ? 0 : i / (n - 1))) * Math.PI / 180;
      ctx.setTransform(Math.cos(a), Math.sin(a), -Math.sin(a), Math.cos(a), lx, ly);
      ctx.drawImage(sprite, -half, -half);
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
  };

  /* ---------- frame loop ---------- */
  let last = performance.now(), blurOn = false, settledAt = null;
  const touchOnly = matchMedia("(hover: none)").matches;
  const frame = (now) => {
    const dt = Math.min(3, (now - last) / 16.667); last = now;

    const k = 1 - Math.pow(1 - (drag ? .35 : .11), dt);
    current += (target - current) * k;
    if (Math.abs(target - current) < .05) current = target;
    vel = (current - prev) / dt; prev = current;
    list.style.transform = `translate3d(0, ${-current.toFixed(2)}px, 0)`;

    // rows stay straight and just sink back with distance from the centre line (a hovered row comes forward).
    const ease = 1 - Math.pow(1 - .14, dt);
    rows.forEach((r, i) => {
      tilt[i] += ((r === active ? 0 : 1) - tilt[i]) * ease;
      const li = r.parentElement;
      const y = li.offsetTop + li.offsetHeight / 2 - current - vh / 2;
      const n = clamp(y / (vh / 2), -1.4, 1.4), f = reduced ? 0 : tilt[i];
      const z = -n * n * 220 * f, sy = -n * Math.abs(n) * 22 * f;
      r.style.transform = `perspective(1100px) translate3d(0, ${sy.toFixed(1)}px, ${z.toFixed(1)}px)`;
      r.style.opacity = (1 - Math.min(.8, Math.abs(n) * .55) * f).toFixed(3);
    });

    const b = reduced ? 0 : Math.min(9, Math.abs(vel) * .3);
    if (b > .35) { blurNode.setAttribute("stdDeviation", `0 ${b.toFixed(2)}`); if (!blurOn) { list.style.filter = "url(#vblur)"; blurOn = true; } }
    else if (blurOn) { list.style.filter = "none"; blurOn = false; }

    if (Math.abs(vel) > .05) pick();
    if (touchOnly && !drag && Math.abs(vel) < .05 && current !== settledAt) {
      settledAt = current;
      setActive(rows[Math.max(0, snaps.indexOf(nearestSnap(current)))] || null);
    }

    // a streak that throws must never take the scroll and logo down with it
    if (splat) { try { frameSplat(splat, now); } catch (err) { console.error(err); splat = null; } }

    // logo: geared to the scroll, with a little weight, stopping a beat after the list does
    const want = clamp(vel * .09, -3.2, 3.2);
    spin += (want - spin) * (1 - Math.pow(1 - .13, dt));
    if (Math.abs(spin) < .004 && Math.abs(want) < .004) spin = 0;
    angle = (angle + spin * dt) % 360;
    if (spin !== 0 || dirty) { drawLogo(); dirty = false; }

    requestAnimationFrame(frame);
  };

  const onResize = () => { measure(); layoutLogo(); };
  addEventListener("resize", onResize);
  document.fonts.ready.then(onResize);
  onResize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
